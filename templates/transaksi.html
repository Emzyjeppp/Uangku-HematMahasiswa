<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UANGKU - Transaksi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-800 flex justify-center items-center min-h-screen">
    <div class="bg-[#FAFAFA] mobile-frame shadow-2xl relative overflow-hidden flex flex-col">
        <div class="flex justify-between items-center p-6 bg-white shrink-0 shadow-sm relative z-10">
            <i class="fas fa-bars text-slate-700 text-lg"></i>
            <h1 class="text-sm font-bold text-slate-800 tracking-wide">Transaksi</h1>
            <a href="{{ url_for('notifikasi') }}"><i class="far fa-bell text-slate-700 text-lg hover:text-[#4CAF50]"></i></a>
        </div>
        <div class="flex-grow overflow-y-auto p-5 no-scrollbar pb-28">
            <div class="flex bg-slate-100 rounded-full p-1 mb-6">
                <button class="flex-1 bg-[#4CAF50] text-white text-xs font-bold py-2.5 rounded-full shadow-sm">Semua</button>
                <button class="flex-1 text-slate-500 text-xs font-bold py-2.5 rounded-full hover:bg-slate-200 transition">Pengeluaran</button>
                <button class="flex-1 text-slate-500 text-xs font-bold py-2.5 rounded-full hover:bg-slate-200 transition">Pemasukan</button>
            </div>
            <div class="mb-6">
                <h3 class="text-xs font-bold text-slate-800 mb-3">15 Mei 2026</h3>
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-50 space-y-5">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center text-lg"><i class="fas fa-arrow-down"></i></div><div><h4 class="text-xs font-bold text-slate-800">Bakso</h4><p class="text-[10px] text-slate-400">Makanan</p></div></div><span class="text-xs font-bold text-red-500">-Rp18.000</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center text-lg"><i class="fas fa-arrow-down"></i></div><div><h4 class="text-xs font-bold text-slate-800">Kopi Susu</h4><p class="text-[10px] text-slate-400">Nongkrong</p></div></div><span class="text-xs font-bold text-red-500">-Rp15.000</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center text-lg"><i class="fas fa-arrow-down"></i></div><div><h4 class="text-xs font-bold text-slate-800">Ojek Online</h4><p class="text-[10px] text-slate-400">Transportasi</p></div></div><span class="text-xs font-bold text-red-500">-Rp20.000</span>
                    </div>
                </div>
            </div>
            <div class="mb-6">
                <h3 class="text-xs font-bold text-slate-800 mb-3">01 Mei 2026</h3>
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-50">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-green-50 text-[#4CAF50] flex items-center justify-center text-lg"><i class="fas fa-arrow-up"></i></div><div><h4 class="text-xs font-bold text-slate-800">Uang Saku</h4><p class="text-[10px] text-slate-400">Pemasukan</p></div></div><span class="text-xs font-bold text-[#4CAF50]">+Rp500.000</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-6 py-3 flex justify-between items-center z-50">
            <a href="{{ url_for('index') }}" class="flex flex-col items-center gap-1 text-slate-300 hover:text-[#4CAF50] transition"><i class="fas fa-home text-lg"></i><span class="text-[9px] font-bold">Beranda</span></a>
            <a href="{{ url_for('transaksi') }}" class="flex flex-col items-center gap-1 text-[#4CAF50]"><i class="fas fa-list text-lg"></i><span class="text-[9px] font-bold">Transaksi</span></a>
            <div class="relative -top-5"><a href="{{ url_for('tambah_pengeluaran') }}"><button class="w-14 h-14 bg-[#4CAF50] text-white rounded-full flex items-center justify-center text-2xl shadow-lg shadow-green-200 border-4 border-white hover:scale-105 transition"><i class="fas fa-plus"></i></button></a></div>
            <a href="{{ url_for('laporan') }}" class="flex flex-col items-center gap-1 text-slate-300 hover:text-[#4CAF50] transition"><i class="fas fa-chart-bar text-lg"></i><span class="text-[9px] font-bold">Laporan</span></a>
            <a href="{{ url_for('profil') }}" class="flex flex-col items-center gap-1 text-slate-300 hover:text-[#4CAF50] transition"><i class="far fa-user text-lg"></i><span class="text-[9px] font-bold">Akun</span></a>
        </div>
    </div>
</body>
</html>
