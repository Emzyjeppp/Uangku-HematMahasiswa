<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UANGKU - Beranda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-800 flex justify-center items-center min-h-screen">
    <div class="bg-[#FAFAFA] mobile-frame shadow-2xl relative overflow-hidden flex flex-col">
        
        <div class="flex justify-between items-center p-6 bg-white shrink-0">
            <i class="fas fa-bars text-slate-700 text-lg cursor-pointer"></i>
            <h1 class="text-sm font-bold tracking-widest text-slate-800">UANGKU</h1>
            <a href="{{ url_for('notifikasi') }}"><i class="far fa-bell text-slate-700 text-lg hover:text-[#4CAF50] transition"></i></a>
        </div>

        <div class="flex-grow overflow-y-auto p-5 no-scrollbar pb-24">
            
            <div class="bg-[#4CAF50] rounded-2xl p-5 text-white shadow-lg shadow-green-200 mb-5 relative overflow-hidden">
                <p class="text-xs font-medium opacity-90 mb-1">Saldo Saat Ini</p>
                <h2 id="saldo-utama" class="text-3xl font-bold">Rp1.500.000</h2>
                <i class="far fa-eye absolute top-5 right-5 opacity-80 cursor-pointer"></i>
                <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-white opacity-10 rounded-full"></div>
            </div>

            <div class="mb-6">
                <h3 class="text-sm font-bold text-slate-800 mb-2">Budget Harian</h3>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <div class="flex justify-between text-xs font-bold mb-2">
                        <span class="text-slate-800" id="teks-budget">Rp0 <span class="text-slate-400 font-medium">/ Rp70.000</span></span>
                        <span class="text-slate-800" id="persen-budget">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2">
                        <div id="bar-budget" class="bg-[#4CAF50] h-2 rounded-full w-[0%] transition-all duration-500"></div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-4 mb-6">
                <a href="{{ url_for('warung_murah') }}" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center border border-slate-50 group-hover:bg-green-50 transition"><i class="fas fa-store text-[#4CAF50] text-xl"></i></div>
                    <span class="text-[10px] font-semibold text-slate-600 text-center leading-tight">Warung<br>Makan</span>
                </a>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center border border-slate-50 cursor-pointer hover:bg-slate-50"><i class="fas fa-calculator text-blue-400 text-xl"></i></div>
                    <span class="text-[10px] font-semibold text-slate-600 text-center leading-tight">Kalkulator</span>
                </div>
                <a href="{{ url_for('target_tabungan') }}" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center border border-slate-50 group-hover:bg-yellow-50 transition"><i class="fas fa-piggy-bank text-yellow-400 text-xl"></i></div>
                    <span class="text-[10px] font-semibold text-slate-600 text-center leading-tight">Tabungan</span>
                </a>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-12 h-12 bg-white rounded-xl shadow-sm flex items-center justify-center border border-slate-50 cursor-pointer hover:bg-slate-50"><i class="fas fa-ellipsis-h text-slate-400 text-xl"></i></div>
                    <span class="text-[10px] font-semibold text-slate-600 text-center leading-tight">Lainnya</span>
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-sm font-bold text-slate-800 mb-3">Ringkasan Bulan Ini</h3>
                <div class="grid grid-cols-2 gap-3">
                    <a href="{{ url_for('tambah_pemasukan') }}" class="bg-green-50 border border-green-100 rounded-2xl p-3 flex flex-col items-center hover:bg-green-100 transition cursor-pointer">
                        <div class="w-6 h-6 rounded-full bg-[#4CAF50] text-white flex items-center justify-center text-[10px] mb-1"><i class="fas fa-arrow-down"></i></div>
                        <span class="text-[10px] text-slate-500 font-medium">Pemasukan</span>
                        <span id="total-pemasukan" class="text-xs font-bold text-[#4CAF50]">Rp0</span>
                    </a>
                    <a href="{{ url_for('tambah_pengeluaran') }}" class="bg-red-50 border border-red-100 rounded-2xl p-3 flex flex-col items-center hover:bg-red-100 transition cursor-pointer">
                        <div class="w-6 h-6 rounded-full bg-red-400 text-white flex items-center justify-center text-[10px] mb-1"><i class="fas fa-arrow-up"></i></div>
                        <span class="text-[10px] text-slate-500 font-medium">Pengeluaran</span>
                        <span id="total-pengeluaran" class="text-xs font-bold text-red-500">Rp0</span>
                    </a>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-800">Transaksi Terbaru</h3>
                </div>
                
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-50 space-y-4" id="container-transaksi">
                    </div>

                <div class="text-center mt-3"><a href="{{ url_for('transaksi') }}" class="text-[11px] font-bold text-[#4CAF50] hover:underline">Lihat Semua</a></div>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-6 py-3 flex justify-between items-center z-50">
            <a href="{{ url_for('index') }}" class="flex flex-col items-center gap-1 text-[#4CAF50]"><i class="fas fa-home text-lg"></i><span class="text-[9px] font-bold">Beranda</span></a>
            <a href="{{ url_for('transaksi') }}" class="flex flex-col items-center gap-1 text-slate-300 hover:text-[#4CAF50] transition"><i class="fas fa-list text-lg"></i><span class="text-[9px] font-bold">Transaksi</span></a>
            <div class="relative -top-5 flex flex-col items-center">
                
                <div id="fab-menu" class="hidden absolute bottom-16 flex flex-col gap-1 bg-white p-2 rounded-2xl shadow-xl border border-slate-100 w-36 origin-bottom transition-all z-50">
                    <a href="{{ url_for('tambah_pemasukan') }}" class="flex items-center gap-3 text-xs font-bold text-slate-700 hover:text-[#4CAF50] p-2 hover:bg-green-50 rounded-xl transition">
                        <div class="w-7 h-7 rounded-full bg-green-100 flex items-center justify-center text-[#4CAF50]"><i class="fas fa-arrow-down"></i></div>
                        Pemasukan
                    </a>
                    <hr class="border-slate-50">
                    <a href="{{ url_for('tambah_pengeluaran') }}" class="flex items-center gap-3 text-xs font-bold text-slate-700 hover:text-red-500 p-2 hover:bg-red-50 rounded-xl transition">
                        <div class="w-7 h-7 rounded-full bg-red-100 flex items-center justify-center text-red-500"><i class="fas fa-arrow-up"></i></div>
                        Pengeluaran
                    </a>
                </div>

                <button id="fab-btn" class="w-14 h-14 bg-[#4CAF50] text-white rounded-full flex items-center justify-center text-2xl shadow-lg shadow-green-200 border-4 border-white hover:scale-105 transition">
                    <i class="fas fa-plus"></i>
                </button>
                
            </div>
            <a href="{{ url_for('laporan') }}" class="flex flex-col items-center gap-1 text-slate-300 hover:text-[#4CAF50] transition"><i class="fas fa-chart-bar text-lg"></i><span class="text-[9px] font-bold">Laporan</span></a>
            <a href="{{ url_for('profil') }}" class="flex flex-col items-center gap-1 text-slate-300 hover:text-[#4CAF50] transition"><i class="far fa-user text-lg"></i><span class="text-[9px] font-bold">Akun</span></a>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
